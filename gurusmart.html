<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeacherSmart – Solusi Cerdas Membuat Perangkat Pembelajaran Guru</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2a3d;--mu:#64748b;--pr:#1d5fd1;--pr2:#e8f0fd;--gr:#16a34a;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--pr:#5b9bff;--pr2:#1e3a6e;--bd:#334155}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--pr:#5b9bff;--pr2:#1e3a6e;--bd:#334155}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
h1,h2,h3{margin:0 0 .5rem}button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:.6rem 1.1rem;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.btn.g{background:var(--gr)}.btn.s{padding:.3rem .7rem;font-size:.85rem}.btn.d{background:#dc2626}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.logo{font-weight:800;font-size:1.3rem;color:var(--pr)}.logo b{color:var(--gr)}
nav.top{display:flex;justify-content:space-between;align-items:center;padding:1rem 5%;background:var(--card);border-bottom:1px solid var(--bd);gap:.5rem}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:2rem;align-items:center;padding:4rem 5%}
.hero h1{font-size:clamp(1.8rem,4vw,2.9rem);line-height:1.15}.hero p{color:var(--mu);font-size:1.1rem}
.sec{padding:2rem 5% 4rem}.ic{font-size:1.8rem}
.app{display:flex;min-height:100vh}
aside{width:240px;background:var(--card);border-right:1px solid var(--bd);padding:1rem;flex-shrink:0}
aside a{display:block;padding:.6rem .8rem;border-radius:8px;color:var(--tx);text-decoration:none;margin:2px 0;cursor:pointer}
aside a:hover,aside a.on{background:var(--pr2);color:var(--pr);font-weight:600}
main{flex:1;padding:1.5rem;min-width:0}.mb{display:none}
label{display:block;font-size:.85rem;color:var(--mu);margin:.6rem 0 .2rem}
input,select,textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 1rem}
.stat{font-size:2rem;font-weight:800;color:var(--pr)}
.tb{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.6rem}
.paper{background:#fff;color:#111;max-width:820px;margin:auto;padding:2rem;border:1px solid var(--bd);box-shadow:0 2px 14px #0002;min-height:60vh;overflow-x:auto}
.paper table{border-collapse:collapse;width:100%}.paper td,.paper th{border:1px solid #444;padding:6px;vertical-align:top}
.tag{font-size:.75rem;padding:.15rem .55rem;border-radius:99px;background:var(--pr2);color:var(--pr)}.tag.ok{background:#dcfce7;color:#15803d}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.tw{overflow-x:auto}
table.l{width:100%;border-collapse:collapse}.l th,.l td{text-align:left;padding:.6rem;border-bottom:1px solid var(--bd)}
.auth{max-width:400px;margin:3rem auto}
@media(max-width:800px){.hero{grid-template-columns:1fr}aside{position:fixed;left:-260px;top:0;bottom:0;z-index:9;transition:.2s}aside.open{left:0}.mb{display:inline-block;margin-bottom:.8rem}}
@media print{body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;border:0;box-shadow:none;max-width:none}}
</style></head><body><div id="v"></div>
<script>
const $=s=>document.querySelector(s);
const J=['SD','SMP','SMA','SMK','MA'];
const TYPES=['Modul Ajar','RPP','ATP (Alur Tujuan Pembelajaran)','Silabus','Program Semester','Program Tahunan','LKPD','Bahan Ajar','Media Pembelajaran','Instrumen Penilaian','Kisi-Kisi Soal','Soal Evaluasi','Rubrik Penilaian','Jurnal Mengajar','Kalender Pendidikan','Modul Projek/P5','Perangkat Lainnya'];
const IC={'Modul Ajar':'📘','RPP':'📄','LKPD':'📋','Soal Evaluasi':'📝'};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let user=ld('gs_user',null),docs=ld('gs_docs',[]),session=ld('gs_sess',false),cur=null,q='',fs='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nav=h=>{location.hash=h};
const sel=(id,arr,v)=>`<select id="${id}">${arr.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
const inp=(id,l,v='',t='text')=>`<div><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}"></div>`;
const g=id=>($('#'+id)||{}).value||'';

function landing(){return `<nav class="top"><div class="logo">Teacher<b>Smart</b></div><div class="row"><a class="btn o s" href="#/login">Masuk</a><a class="btn s" href="#/register">Daftar</a></div></nav>
<section class="hero"><div><span class="tag">Solusi Cerdas Membuat Perangkat Pembelajaran Guru</span><h1 style="margin-top:.8rem">Buat Perangkat Pembelajaran Lebih Cepat dan Mudah</h1><p>TeacherSmart membantu guru membuat berbagai perangkat pembelajaran secara terstruktur, profesional, dan siap digunakan.</p><div class="row"><a class="btn" href="#/register">Mulai Membuat Perangkat</a><a class="btn o" href="#fitur" onclick="document.getElementById('fitur').scrollIntoView({behavior:'smooth'});return false">Lihat Fitur</a></div></div>
<svg viewBox="0 0 320 240" style="width:100%"><rect x="20" y="170" width="280" height="14" rx="7" fill="#1d5fd1" opacity=".2"/><rect x="90" y="110" width="140" height="80" rx="8" fill="#1d5fd1"/><rect x="98" y="118" width="124" height="60" rx="4" fill="#e8f0fd"/><rect x="108" y="128" width="70" height="6" fill="#1d5fd1"/><rect x="108" y="142" width="100" height="5" fill="#16a34a"/><rect x="108" y="154" width="85" height="5" fill="#94a3b8"/><rect x="70" y="190" width="180" height="8" rx="4" fill="#0f3d91"/><circle cx="60" cy="90" r="24" fill="#fbbf77"/><path d="M28 200v-50a32 32 0 0164 0v50z" fill="#16a34a"/><path d="M36 82a24 24 0 0148 0z" fill="#3b2a1a"/></svg></section>
<section class="sec" id="fitur"><h2 style="text-align:center">Keunggulan TeacherSmart</h2><div class="grid" style="margin-top:1.5rem">${[['⚡','Cepat','Membuat perangkat pembelajaran dalam beberapa langkah.'],['👍','Mudah','Cukup mengisi data pembelajaran.'],['🧩','Terstruktur','Dokumen dibuat dengan format yang sistematis.'],['⬇️','Siap Diunduh','Hasil dapat disimpan dalam format Word dan PDF.']].map(x=>`<div class="card"><div class="ic">${x[0]}</div><h3>${x[1]}</h3><p style="color:var(--mu);margin:0">${x[2]}</p></div>`).join('')}</div></section>`}

function login(){return `<div class="auth card"><div class="logo">Teacher<b>Smart</b></div><h2 style="margin-top:1rem">Masuk</h2>${inp('e','Email','','email')}${inp('p','Kata sandi','','password')}<p style="margin:.5rem 0"><a href="#/lupa">Lupa password?</a></p><button class="btn" style="width:100%" onclick="doLogin()">Masuk</button><p style="color:var(--mu)">Belum punya akun? <a href="#/register">Daftar</a></p><p style="color:var(--mu);font-size:.8rem">Mode demo: data disimpan di peramban Anda.</p></div>`}
function register(){return `<div class="auth card" style="max-width:560px"><div class="logo">Teacher<b>Smart</b></div><h2 style="margin-top:1rem">Registrasi Guru</h2><div class="f2">${inp('nama','Nama lengkap')}${inp('nip','NIP/NUPTK')}${inp('e','Email','','email')}${inp('p','Kata sandi','','password')}${inp('sek','Sekolah')}${inp('mp','Mata pelajaran')}<div><label>Jenjang</label>${sel('jj',J)}</div>${inp('kls','Kelas')}</div><br><button class="btn" style="width:100%" onclick="doReg()">Daftar</button><p style="color:var(--mu)">Sudah punya akun? <a href="#/login">Masuk</a></p></div>`}
function lupa(){return `<div class="auth card"><h2>Lupa Password</h2><p style="color:var(--mu)">Masukkan email Anda untuk menerima tautan reset.</p>${inp('e','Email','','email')}<br><button class="btn" onclick="alert('Demo: tautan reset akan dikirim lewat Supabase Auth pada versi produksi.');nav('/login')">Kirim Tautan</button> <a href="#/login">Kembali</a></div>`}
function doLogin(){if(!g('e'))return alert('Isi email');if(!user)user={nama:'Guru Demo',nip:'',email:g('e'),sekolah:'SMP Negeri 1',mp:'Matematika',jj:'SMP',kls:'8'};user.role=/admin/i.test(g('e'))?'admin':'guru';sv('gs_user',user);session=true;sv('gs_sess',true);nav('/dashboard')}
function doReg(){if(!g('nama')||!g('e'))return alert('Nama dan email wajib diisi');user={nama:g('nama'),nip:g('nip'),email:g('e'),sekolah:g('sek'),mp:g('mp'),jj:g('jj'),kls:g('kls')};sv('gs_user',user);session=true;sv('gs_sess',true);nav('/dashboard')}
function logout(){session=false;sv('gs_sess',false);nav('/')}

const MENU=[['🏠','Dashboard','/dashboard'],['📄','Buat Perangkat','/buat'],['📚','Perangkat Saya','/saya'],['📝','Generator Soal','/buat/Soal Evaluasi'],['📋','Generator LKPD','/buat/LKPD'],['📑','Template','/template'],['👤','Profil','/profil'],['⚙️','Pengaturan','/pengaturan']];
function shell(h,p){return `<div class="app"><aside id="sb"><div class="logo" style="margin:.5rem .8rem 1rem">Teacher<b>Smart</b></div>${MENU.map(m=>`<a class="${p==m[2]?'on':''}" href="#${m[2]}">${m[0]} ${m[1]}</a>`).join('')}${user.role=='admin'?`<a class="${p=='/admin'?'on':''}" href="#/admin">🛡️ Admin</a>`:''}<a onclick="logout()">🚪 Logout</a></aside><main><button class="btn o s mb" onclick="$('#sb').classList.toggle('open')">☰ Menu</button>${h}</main></div>`}

function dash(){const m=new Date().toISOString().slice(0,7);const st=[['Total perangkat',docs.length],['Bulan ini',docs.filter(d=>d.tgl.startsWith(m)).length],['Draft',docs.filter(d=>d.status=='Draft').length],['Selesai',docs.filter(d=>d.status=='Selesai').length]];
return `<h1>Selamat datang, ${esc(user.nama)} 👋</h1><p style="color:var(--mu)">Apa yang ingin Anda buat hari ini?</p><div class="grid">${st.map(s=>`<div class="card"><div style="color:var(--mu)">${s[0]}</div><div class="stat">${s[1]}</div></div>`).join('')}</div><br><a class="btn g" style="font-size:1.1rem;padding:.9rem 1.5rem" href="#/buat">+ Buat Perangkat Pembelajaran</a><br><br><div class="card"><h3>Terakhir dibuat</h3>${docs.length?docs.slice(0,3).map(d=>`<div style="padding:.4rem 0"><a href="#/dok/${d.id}">${esc(d.judul)}</a> <span class="tag">${d.status}</span></div>`).join(''):'<p style="color:var(--mu)">Belum ada perangkat.</p>'}</div>`}

function buat(){return `<h1>Buat Perangkat</h1><p style="color:var(--mu)">Pilih jenis perangkat pembelajaran.</p><div class="grid">${TYPES.map(t=>`<a class="card" style="text-decoration:none;color:inherit" href="#/buat/${encodeURIComponent(t)}"><div class="ic">${IC[t]||'📑'}</div><b>${t}</b></a>`).join('')}</div>`}

function form(t){const soal=/Soal/.test(t);return `<h1>${IC[t]||'📑'} Form ${t}</h1><div class="card"><h3>Informasi Umum</h3><div class="f2">${inp('gr','Nama guru',user.nama)}${inp('nip','NIP/NUPTK',user.nip)}${inp('sk','Nama sekolah',user.sekolah)}<div><label>Jenjang</label>${sel('jj',J,user.jj)}</div>${inp('kl','Kelas',user.kls)}${inp('mp','Mata pelajaran',user.mp)}<div><label>Fase</label>${sel('fs',['A','B','C','D','E','F'])}</div><div><label>Semester</label>${sel('sm',['Ganjil','Genap'])}</div>${inp('th','Tahun ajaran','2026/2027')}${inp('aw','Alokasi waktu','2 x 40 menit')}</div>
<h3 style="margin-top:1rem">Isi Pembelajaran</h3>${inp('tp','Topik/materi')}<label>Tujuan pembelajaran</label><textarea id="tj" rows="2"></textarea><div class="f2"><div><label>Model pembelajaran</label>${sel('md',['Problem Based Learning','Project Based Learning','Discovery Learning','Inquiry','Cooperative Learning'])}</div>${inp('mt','Metode','Diskusi, tanya jawab, presentasi')}${inp('pp','Profil Pelajar Pancasila','Bernalar kritis, gotong royong')}${inp('sr','Sarana & prasarana','Papan tulis, proyektor')}</div>
${soal?`<h3 style="margin-top:1rem">Pengaturan Soal</h3><div class="f2">${inp('jm','Jumlah soal','5','number')}<div><label>Bentuk soal</label>${sel('bs',['Pilihan ganda','Isian','Benar/Salah','Essay','Menjodohkan'])}</div><div><label>Tingkat kesulitan</label>${sel('lv',['Mudah','Sedang','Sulit'])}</div></div>`:''}
<br><label>Instruksi untuk AI (opsional)</label><textarea id="ai" rows="2" placeholder="Contoh: Buatkan modul ajar Matematika kelas 8 SPLDV dengan Problem Based Learning."></textarea><br><div class="row"><button class="btn g" onclick="gen('${t.replace(/'/g,"\\'")}')">Generate ${t.split(' (')[0]}</button><button class="btn" onclick="gen('${t.replace(/'/g,"\\'")}',1)">✨ Buat dengan AI</button></div><p style="color:var(--mu);font-size:.85rem">Mode demo: hasil dibuat dari data formulir. Hasil selalu dapat diperiksa dan diedit sebelum digunakan.</p></div>`}

function gen(t,ai){const d={};'gr nip sk jj kl mp fs sm th aw tp tj md mt pp sr jm bs lv'.split(' ').forEach(k=>d[k]=g(k));
if(!d.tp)return alert('Isi topik/materi terlebih dahulu');
const tj=d.tj||`Peserta didik mampu memahami dan menerapkan ${d.tp} dengan benar.`;
const id=`<table><tr><td width="30%">Sekolah</td><td>${esc(d.sk)}</td></tr><tr><td>Guru</td><td>${esc(d.gr)} ${d.nip?'(NIP/NUPTK '+esc(d.nip)+')':''}</td></tr><tr><td>Mata pelajaran</td><td>${esc(d.mp)}</td></tr><tr><td>Jenjang / Kelas / Fase</td><td>${d.jj} / ${esc(d.kl)} / ${d.fs}</td></tr><tr><td>Semester / Tahun ajaran</td><td>${d.sm} / ${esc(d.th)}</td></tr><tr><td>Alokasi waktu</td><td>${esc(d.aw)}</td></tr></table>`;
const L=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
let b='';
if(t=='Modul Ajar'||t=='RPP'||t=='Modul Projek/P5')b=`<h2>A. Informasi Umum</h2>${id}<p><b>Topik:</b> ${esc(d.tp)}<br><b>Profil Pelajar Pancasila:</b> ${esc(d.pp)}<br><b>Sarana dan prasarana:</b> ${esc(d.sr)}<br><b>Model / Metode:</b> ${d.md} / ${esc(d.mt)}</p><h2>B. Tujuan Pembelajaran</h2><p>${esc(tj)}</p><h2>C. Pertanyaan Pemantik</h2>${L([`Di mana kita menemukan ${esc(d.tp)} dalam kehidupan sehari-hari?`,`Mengapa ${esc(d.tp)} penting untuk dipelajari?`])}<h2>D. Kegiatan Pembelajaran</h2><h3>Pendahuluan (10 menit)</h3>${L(['Salam, doa, dan presensi.','Apersepsi dan pertanyaan pemantik.','Menyampaikan tujuan pembelajaran.'])}<h3>Kegiatan Inti (60 menit)</h3>${L([`Orientasi peserta didik pada masalah terkait ${esc(d.tp)} (${d.md}).`,'Peserta didik berkelompok mengerjakan LKPD.','Diskusi dan pengembangan hasil karya.','Presentasi dan penguatan guru.'])}<h3>Penutup (10 menit)</h3>${L(['Menyimpulkan pembelajaran bersama.','Refleksi dan tindak lanjut.','Doa dan salam.'])}<h2>E. Asesmen</h2>${L(['Diagnostik: pertanyaan awal kesiapan belajar.','Formatif: observasi dan LKPD.','Sumatif: tes tertulis atau produk.'])}<h2>F. Diferensiasi</h2>${L(['Konten: bahan bacaan bertingkat.','Proses: kelompok sesuai kesiapan.','Produk: pilihan bentuk laporan.'])}<h2>G. Refleksi</h2>${L(['Guru: Apakah tujuan tercapai? Apa yang perlu diperbaiki?','Peserta didik: Apa yang sudah dipahami? Apa yang masih sulit?'])}`;
else if(t=='LKPD')b=`<h2>Identitas LKPD</h2>${id}<h2>Tujuan</h2><p>${esc(tj)}</p><h2>Petunjuk</h2>${L(['Berdoalah sebelum memulai.','Kerjakan bersama kelompok.','Tanyakan kepada guru jika ada kesulitan.'])}<h2>Materi Singkat</h2><p>${esc(d.tp)} — tuliskan ringkasan konsep utama di sini.</p><h2>Aktivitas (${d.md})</h2><ol><li>Amati permasalahan yang diberikan guru.</li><li>Diskusikan langkah penyelesaian.</li><li>Tuliskan hasil kerja kelompok.</li></ol><h2>Pertanyaan</h2><ol><li>Jelaskan konsep ${esc(d.tp)} dengan kata-katamu sendiri.</li><li>Berikan satu contoh penerapannya.</li></ol><h2>Kesimpulan</h2><p>................................................</p><h2>Refleksi</h2><p>Hal yang saya pelajari hari ini: ................</p>`;
else if(/Soal/.test(t)){const n=Math.min(+d.jm||5,20);let s='',k='',kk='';for(let i=1;i<=n;i++){const ab=d.bs=='Pilihan ganda';s+=`<li>(${d.lv}) Soal ${i} tentang ${esc(d.tp)}.${ab?'<br>A. ......&nbsp; B. ......&nbsp; C. ......&nbsp; D. ......':'<br>................'}</li>`;k+=`<li>${ab?'B':'Jawaban sesuai pedoman'}</li>`;kk+=`<tr><td>${i}</td><td>Menyelesaikan masalah ${esc(d.tp)}</td><td>${d.lv}</td><td>${d.bs}</td></tr>`}
b=`<h2>Identitas</h2>${id}<h2>Soal (${d.bs}, ${d.lv})</h2><ol>${s}</ol><h2>Kunci Jawaban</h2><ol>${k}</ol><h2>Kisi-Kisi</h2><table><tr><th>No</th><th>Indikator</th><th>Level</th><th>Bentuk</th></tr>${kk}</table><h2>Pedoman Penskoran</h2><p>Skor tiap soal 1 (benar) / 0 (salah). Nilai = skor diperoleh ÷ skor maksimal × 100.</p>`}
else b=`<h2>Informasi Umum</h2>${id}<h2>Topik</h2><p>${esc(d.tp)}</p><h2>Tujuan</h2><p>${esc(tj)}</p><h2>Isi ${t}</h2><table><tr><th>No</th><th>Komponen</th><th>Uraian</th></tr><tr><td>1</td><td>Materi</td><td>${esc(d.tp)}</td></tr><tr><td>2</td><td>Model</td><td>${d.md}</td></tr><tr><td>3</td><td>Alokasi waktu</td><td>${esc(d.aw)}</td></tr></table><p><i>Lengkapi dan sesuaikan isi dokumen ini pada editor.</i></p>`;
const doc={id:Date.now().toString(36),jenis:t,judul:`${t.split(' (')[0]} ${d.mp||''} Kelas ${d.kl} – ${d.tp}`,mp:d.mp,kelas:d.kl,tgl:new Date().toISOString().slice(0,10),status:'Draft',isi:`<h1 style="text-align:center">${t.split(' (')[0].toUpperCase()}</h1>${b}`};
docs.unshift(doc);sv('gs_docs',docs);nav('/dok/'+doc.id)}

function editor(id){const d=docs.find(x=>x.id==id);if(!d)return '<p>Dokumen tidak ditemukan.</p>';cur=d;
const c=(cmd,l,v)=>`<button class="btn o s" onmousedown="event.preventDefault();document.execCommand('${cmd}',false,${v?`'${v}'`:'null'})">${l}</button>`;
return `<div class="row" style="justify-content:space-between"><h2>${esc(d.judul)}</h2><span class="tag ${d.status=='Selesai'?'ok':''}" id="st">${d.status}</span></div>
<div class="tb">${c('bold','<b>B</b>')}${c('italic','<i>I</i>')}${c('underline','<u>U</u>')}${c('formatBlock','H2','h2')}${c('formatBlock','H3','h3')}${c('insertUnorderedList','• List')}${c('insertOrderedList','1. List')}${c('justifyLeft','⬅')}${c('justifyCenter','↔')}${c('justifyRight','➡')}${c('undo','↶')}${c('redo','↷')}<button class="btn o s" onclick="document.execCommand('insertHTML',false,'<table><tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr></table><p></p>')">▦ Tabel</button></div>
<div class="paper" id="ed" contenteditable="true" oninput="auto()">${d.isi}</div><br>
<div class="row"><button class="btn g" onclick="saveDoc('Selesai')">💾 Simpan</button><button class="btn o" onclick="saveDoc('Draft')">Simpan Draft</button><button class="btn o" onclick="dup('${d.id}')">Duplikat</button><button class="btn" onclick="dlWord()">Download Word</button><button class="btn" onclick="window.print()">Download PDF</button><button class="btn o" onclick="window.print()">🖨 Print</button></div><p style="color:var(--mu);font-size:.85rem">Perubahan tersimpan otomatis. Untuk PDF, pilih “Simpan sebagai PDF” pada dialog cetak.</p>`}
let tm;function auto(){clearTimeout(tm);tm=setTimeout(()=>{cur.isi=$('#ed').innerHTML;sv('gs_docs',docs);const s=$('#st');if(s)s.textContent=cur.status+' · tersimpan'},600)}
function saveDoc(s){cur.isi=$('#ed').innerHTML;cur.status=s;sv('gs_docs',docs);alert('Dokumen disimpan sebagai '+s);nav('/saya')}
function dup(id){const d=docs.find(x=>x.id==id);docs.unshift({...d,id:Date.now().toString(36),judul:d.judul+' (Salinan)',status:'Draft',tgl:new Date().toISOString().slice(0,10)});sv('gs_docs',docs);nav('/saya')}
function dlWord(id){const d=id?docs.find(x=>x.id==id):cur;const h=id?d.isi:$('#ed').innerHTML;const b=new Blob(['<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>table{border-collapse:collapse}td,th{border:1px solid #000;padding:4px}</style></head><body>'+h+'</body></html>'],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.judul.replace(/[^\w\- ]/g,'')+'.doc';a.click()}
function del(id){if(confirm('Hapus dokumen ini?')){docs=docs.filter(x=>x.id!=id);sv('gs_docs',docs);route()}}

function saya(){const r=docs.filter(d=>(d.judul+d.mp).toLowerCase().includes(q.toLowerCase())&&(!fs||d.status==fs));
return `<h1>Perangkat Saya</h1><div class="row" style="margin-bottom:1rem"><input style="max-width:280px" placeholder="🔍 Cari dokumen..." value="${esc(q)}" oninput="q=this.value;rl()" id="qi"><select style="max-width:160px" onchange="fs=this.value;rl()"><option value="">Semua status</option><option ${fs=='Draft'?'selected':''}>Draft</option><option ${fs=='Selesai'?'selected':''}>Selesai</option></select></div><div class="card tw"><table class="l"><tr><th>Dokumen</th><th>Jenis</th><th>Mapel</th><th>Kelas</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr>${r.map(d=>`<tr><td>${esc(d.judul)}</td><td>${esc(d.jenis.split(' (')[0])}</td><td>${esc(d.mp)}</td><td>${esc(d.kelas)}</td><td>${d.tgl}</td><td><span class="tag ${d.status=='Selesai'?'ok':''}">${d.status}</span></td><td><div class="row"><a class="btn s" href="#/dok/${d.id}">Buka/Edit</a><button class="btn o s" onclick="dlWord('${d.id}')">⬇</button><button class="btn o s" onclick="dup('${d.id}')">Duplikat</button><button class="btn d s" onclick="del('${d.id}')">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--mu)">Belum ada dokumen. <a href="#/buat">Buat sekarang</a></td></tr>'}</table></div>`}
function rl(){const i=$('#qi');const p=i?i.selectionStart:0;route();const n=$('#qi');if(n){n.focus();n.setSelectionRange(p,p)}}

function tmpl(){return `<h1>Template</h1><p style="color:var(--mu)">Pilih jenjang lalu template untuk mulai mengisi.</p>${['SD','SMP','SMA','SMK','Madrasah'].map(j=>`<h3 style="margin-top:1rem">${j}</h3><div class="row">${['Modul Ajar','RPP','LKPD','ATP (Alur Tujuan Pembelajaran)','Silabus','Program Tahunan','Program Semester','Kisi-Kisi Soal','Soal Evaluasi','Rubrik Penilaian'].map(t=>`<a class="tag" style="padding:.4rem .8rem;text-decoration:none" href="#/buat/${encodeURIComponent(t)}">${t.split(' (')[0]}</a>`).join('')}</div>`).join('')}`}
function profil(){return `<h1>Profil Saya</h1><div class="card"><div class="f2">${inp('nama','Nama',user.nama)}${inp('nip','NIP/NUPTK',user.nip)}${inp('e','Email',user.email)}${inp('sek','Sekolah',user.sekolah)}${inp('mp','Mata pelajaran',user.mp)}<div><label>Jenjang</label>${sel('jj',J,user.jj)}</div>${inp('kls','Kelas',user.kls)}</div><br><button class="btn g" onclick="user={nama:g('nama'),nip:g('nip'),email:g('e'),sekolah:g('sek'),mp:g('mp'),jj:g('jj'),kls:g('kls')};sv('gs_user',user);alert('Profil diperbarui')">Simpan Profil</button></div>`}
function setting(){return `<h1>Pengaturan</h1><div class="card"><label>Tampilan</label><select onchange="document.documentElement.dataset.theme=this.value"><option value="light">Terang</option><option value="dark">Gelap</option></select><br><br><button class="btn d" onclick="if(confirm('Hapus semua data demo?')){try{localStorage.clear()}catch(e){}location.reload()}">Hapus Semua Data Demo</button></div>`}

function tpls(){return ld('gs_tpl',[{n:'Modul Ajar Umum',k:'SMP',j:'Modul Ajar'},{n:'LKPD Dasar',k:'SD',j:'LKPD'}])}
function addT(){if(!g('tn'))return;const t=tpls();t.push({n:g('tn'),k:g('tk'),j:g('tj2')});sv('gs_tpl',t);route()}
function delT(i){const t=tpls();t.splice(i,1);sv('gs_tpl',t);route()}
function edT(i){const t=tpls(),n=prompt('Nama template baru:',t[i].n);if(n){t[i].n=n;sv('gs_tpl',t);route()}}
function admin(){const t=tpls(),by={};docs.forEach(d=>{const j=d.jenis.split(' (')[0];by[j]=(by[j]||0)+1});const mx=Math.max(1,...Object.values(by));
const st=[['Jumlah pengguna',1],['Jumlah perangkat dibuat',docs.length],['Template',t.length],['Dokumen selesai',docs.filter(d=>d.status=='Selesai').length]];
return `<h1>🛡️ Dashboard Admin</h1><div class="grid">${st.map(x=>`<div class="card"><div style="color:var(--mu)">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><br>
<div class="card"><h3>Jenis perangkat paling banyak dibuat</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="margin:.3rem 0;flex-wrap:nowrap"><span style="width:140px;flex-shrink:0">${esc(k)}</span><div style="background:var(--pr);height:14px;border-radius:7px;width:${v/mx*50}%"></div><b>${v}</b></div>`).join('')||'<p style="color:var(--mu)">Belum ada data.</p>'}</div><br>
<div class="card"><h3>Kelola Pengguna</h3><div class="tw"><table class="l"><tr><th>Nama</th><th>Email</th><th>Sekolah</th><th>Peran</th></tr><tr><td>${esc(user.nama)}</td><td>${esc(user.email)}</td><td>${esc(user.sekolah)}</td><td><span class="tag">${user.role}</span></td></tr></table></div></div><br>
<div class="card"><h3>Kelola Template</h3><div class="f2">${inp('tn','Nama template')}<div><label>Kategori</label>${sel('tk',['SD','SMP','SMA','SMK','Madrasah'])}</div><div><label>Jenis</label>${sel('tj2',['Modul Ajar','RPP','LKPD','ATP','Silabus','Soal','Rubrik Penilaian'])}</div></div><br><button class="btn g" onclick="addT()">+ Tambah Template</button><div class="tw"><table class="l" style="margin-top:1rem"><tr><th>Template</th><th>Kategori</th><th>Jenis</th><th>Aksi</th></tr>${t.map((x,i)=>`<tr><td>${esc(x.n)}</td><td>${x.k}</td><td>${x.j}</td><td><div class="row"><button class="btn o s" onclick="edT(${i})">Edit</button><button class="btn d s" onclick="delT(${i})">Hapus</button></div></td></tr>`).join('')}</table></div></div>`}
function route(){const h=decodeURIComponent(location.hash.slice(1))||'/';const v=$('#v');
if(h=='/')return v.innerHTML=landing();
if(h=='/login')return v.innerHTML=login();if(h=='/register')return v.innerHTML=register();if(h=='/lupa')return v.innerHTML=lupa();
if(!session||!user){nav('/login');return}
let c;if(h=='/dashboard')c=dash();else if(h=='/buat')c=buat();else if(h.startsWith('/buat/'))c=form(h.slice(6));else if(h.startsWith('/dok/'))c=editor(h.slice(5));else if(h=='/saya')c=saya();else if(h=='/template')c=tmpl();else if(h=='/admin')c=user.role=='admin'?admin():'<p>Akses ditolak. Masuk dengan email yang memuat kata "admin" (mode demo).</p>';else if(h=='/profil')c=profil();else if(h=='/pengaturan')c=setting();else c=dash();
v.innerHTML=shell(c,h.startsWith('/dok')?'/saya':h);scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
